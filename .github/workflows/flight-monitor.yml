name: ✈️ 携程中意直飞价格监控 (云端自动化浏览器巡检 + 真正一键刷新)

on:
  # 云端全自动无人值守监控：每 3 小时自动启动 Playwright 自动化浏览器抓取最新价格并部署
  schedule:
    - cron: '0 */3 * * *'

  # 支持网页端/GitHub 页面一键触发真刷新
  workflow_dispatch:

  # 代码推送时自动运行
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-data"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 安装依赖包与云端自动化浏览器 (Playwright Chromium)
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: 🔄 运行自动化浏览器抓取携程最新真实运价
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
        run: node scripts/update-data.js

      - name: 💾 提交最新真实价格快照回仓库
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore(data): 云端自动化浏览器更新携程直飞最新票价 [skip ci]"
          git push || true

      - name: 🌐 配置 GitHub Pages
        id: pages_cfg
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 📦 上传 GitHub Pages 静态包
        if: steps.pages_cfg.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: 🚀 发布部署至 GitHub Pages
        if: steps.pages_cfg.outcome == 'success'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
